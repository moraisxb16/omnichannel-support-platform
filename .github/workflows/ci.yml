name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, bcmath
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint
        run: find app database tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        run: php artisan test

      # The demo asserts its own outcomes and exits non-zero on failure, so
      # running it here keeps the README honest: if the output quoted in it
      # stops being true, CI says so.
      - name: Demonstrations
        run: php artisan support:demo

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      # A build failure is a broken inbox. Worth catching here rather than on a
      # machine that happens to have a stale node_modules.
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
